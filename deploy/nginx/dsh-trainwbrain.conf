# /etc/nginx/sites-available/dsh-trainwbrain.conf
# ОПЦИОНАЛЬНО: DeepSeek Harness Web UI по HTTPS.
#
# ВНИМАНИЕ: DSH-агент выполняет команды shell на сервере от пользователя deploy.
# Публиковать его в интернет можно ТОЛЬКО за Basic Auth + по возможности
# с ограничением по IP. Безопаснее — SSH-туннель (см. DEPLOY.md, раздел 11).
#
# Подготовка:
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-dsh deploy
#   certbot certonly --webroot -w /var/www/certbot -d dsh.trainwbrain.ru
# DSH запускать с флагом:  --trusted-host dsh.trainwbrain.ru

server {
    listen 80;
    listen [::]:80;
    server_name dsh.trainwbrain.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dsh.trainwbrain.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dsh.trainwbrain.ru;

    ssl_certificate     /etc/letsencrypt/live/dsh.trainwbrain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsh.trainwbrain.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    auth_basic           "DSH";
    auth_basic_user_file /etc/nginx/.htpasswd-dsh;

    # Опционально: пускать только со своих IP (закомментируйте, если не нужно).
    # allow 203.0.113.10;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
