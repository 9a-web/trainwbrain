# /etc/nginx/sites-available/dev-trainwbrain.conf
# ОПЦИОНАЛЬНО: dev-фронтенд (CRA dev server на 127.0.0.1:3000) по HTTPS.
#
# Нужен, только если хотите открывать dev-версию с телефона / из Telegram.
# Для обычной разработки с ноутбука проще SSH-туннель (см. DEPLOY.md, раздел 10)
# и этот файл не нужен.
#
# Сертификат: certbot certonly --webroot -w /var/www/certbot -d dev.trainwbrain.ru
# В frontend/.env.development на сервере:
#   REACT_APP_BACKEND_URL=http://localhost:8001
#   WDS_SOCKET_PORT=443
#   WDS_SOCKET_HOST=dev.trainwbrain.ru

server {
    listen 80;
    listen [::]:80;
    server_name dev.trainwbrain.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dev.trainwbrain.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.trainwbrain.ru;

    ssl_certificate     /etc/letsencrypt/live/dev.trainwbrain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.trainwbrain.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # CRA dev server отдаёт всё сам, включая HMR (WebSocket).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
