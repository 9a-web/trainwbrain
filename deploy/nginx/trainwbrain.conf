# /etc/nginx/sites-available/trainwbrain.conf
# TrainWithBrain: статика React (frontend/build) + reverse proxy на FastAPI.
#
# Перед включением:
#   1) deploy/nginx/00-upgrade-map.conf -> /etc/nginx/conf.d/
#   2) получить сертификат:
#      certbot certonly --webroot -w /var/www/certbot \
#        -d trainwbrain.ru -d www.trainwbrain.ru
#   3) ln -s /etc/nginx/sites-available/trainwbrain.conf /etc/nginx/sites-enabled/
#   4) nginx -t && systemctl reload nginx

upstream twb_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# --- HTTP: ACME-челлендж + редирект на HTTPS -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name trainwbrain.ru www.trainwbrain.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://trainwbrain.ru$request_uri;
    }
}

# --- www -> без www --------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.trainwbrain.ru;

    ssl_certificate     /etc/letsencrypt/live/trainwbrain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trainwbrain.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://trainwbrain.ru$request_uri;
}

# --- основной сайт ---------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trainwbrain.ru;

    ssl_certificate     /etc/letsencrypt/live/trainwbrain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trainwbrain.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /opt/trainwbrain/frontend/build;
    index index.html;

    # Фото из дневника / xlsx-программы уходят в backend multipart-ом.
    client_max_body_size 25m;

    # Telegram Web открывает Mini App в iframe (web.telegram.org),
    # поэтому X-Frame-Options НЕ ставим — вместо него frame-ancestors.
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # --- WebSocket живого статуса: /api/ws --------------------------------
    location = /api/ws {
        proxy_pass http://twb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- REST API ----------------------------------------------------------
    location /api/ {
        proxy_pass http://twb_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ИИ-разбор программы/фото может думать до 180 с (httpx timeout).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- хэшированные ассеты CRA ------------------------------------------
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- service worker не кэшируем, иначе обновления приложения "залипают"
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # --- SPA: всё остальное -> index.html ----------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
